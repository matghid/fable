name: fetch-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated assets
        run: |
          mkdir -p assets/raw
          curl -fsSL -o assets/raw/raw_title.png "https://d8j0ntlcm91z4.cloudfront.net/user_3F0SyBeMNON3oce1NhwsmltEAKF/hf_20260611_211235_88a0bba5-8b56-41da-a630-6afefb17193d.png"
          curl -fsSL -o assets/raw/raw_intro.png "https://d8j0ntlcm91z4.cloudfront.net/user_3F0SyBeMNON3oce1NhwsmltEAKF/hf_20260611_211236_8842281e-461a-46c9-8fe9-eacedfbbf757.png"
          curl -fsSL -o assets/raw/raw_ending_good.png "https://d8j0ntlcm91z4.cloudfront.net/user_3F0SyBeMNON3oce1NhwsmltEAKF/hf_20260611_211242_3c4ca84f-3b7e-48a1-978e-4e1eb0d37b22.png"
          curl -fsSL -o assets/raw/raw_ending_evil.png "https://d8j0ntlcm91z4.cloudfront.net/user_3F0SyBeMNON3oce1NhwsmltEAKF/hf_20260611_211243_0d2f12f3-dfde-41ac-94e8-8b87b879e66f.png"
          curl -fsSL -o assets/raw/raw_hero.png "https://d8j0ntlcm91z4.cloudfront.net/user_3F0SyBeMNON3oce1NhwsmltEAKF/hf_20260611_211250_9358bbe1-8c03-422b-9210-c95b92bfdaea.png"
      - name: Commit raw assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/raw
          git commit -m "Aggiunge asset grezzi generati (temporanei)"
          git push
